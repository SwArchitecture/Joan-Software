<title>Joan Software</title>
<style>
  :root { --pink:#e6007e; --pink-ink:#790047; --yellow:#ffed00; --ink:#242126; --muted:#534b51; --line:#e8cdda; }
  * { box-sizing:border-box; }
  body { margin:0; border-top:8px solid var(--pink); background:#fbf9fa; color:var(--ink); font:1rem/1.55 "Segoe UI",system-ui,sans-serif; }
  main,footer { width:min(1080px,calc(100% - 2rem)); margin-inline:auto; }
  header { padding-block:clamp(2.5rem,9vw,6.5rem) clamp(2.5rem,7vw,4.5rem); }
  header img { display:block; margin-bottom:1.25rem; }
  h1 { margin:0; font-size:clamp(2.5rem,8vw,5.75rem); line-height:1.04; letter-spacing:-.05em; }
  h1::after { content:""; display:block; width:3.5rem; height:6px; margin-top:1.15rem; background:var(--yellow); }
  .products { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; }
  article { display:flex; flex-direction:column; align-items:flex-start; background:white; padding:clamp(1rem,2.5vw,1.75rem); border:1px solid var(--line); border-top:3px solid var(--pink); border-radius:8px; }
  h2 { margin:0; font-size:1.28rem; line-height:1.2; overflow-wrap:anywhere; }
  article p { margin:.65rem 0 1.35rem; color:var(--muted); }
  article a { margin-top:auto; font-size:.94rem; font-weight:650; }
  a { color:var(--pink-ink); text-underline-offset:.18em; overflow-wrap:anywhere; }
  a:focus-visible { outline:2px solid var(--pink); outline-offset:4px; }
  footer { margin-block:clamp(2rem,7vw,4rem); padding-top:1rem; border-top:1px solid var(--line); }
  @media (max-width:740px) { .products { grid-template-columns:1fr; } }
</style>

    <h1>Joan Software</h1>
  </header>
  <p id="product-status" role="status" hidden></p>
  <noscript>Enable JavaScript to display the product list.</noscript>
  <section id="products" class="products" aria-label="Products"></section>
</main>
<footer><a href="mailto:joan.software@outlook.com">joan.software@outlook.com</a></footer>
<script>
  const grid = document.getElementById('products');
  const status = document.getElementById('product-status');

  function renderProducts(products) {
    if (!Array.isArray(products)) throw new Error('Expected an array of products.');
    const cards = [];
    for (const [index, product] of products.entries()) {
      if (product && Object.hasOwn(product, 'enabled') && typeof product.enabled !== 'boolean') {
        throw new Error(`Product ${index + 1} needs a boolean enabled value.`);
      }
      if (product?.enabled === false) continue;

      if (!product || !['name', 'description', 'link'].every(
        field => typeof product[field] === 'string' && product[field].trim()
      )) throw new Error(`Product ${index + 1} needs a name, description, and link.`);

      const url = new URL(product.link, location.href);
      if (!['http:', 'https:'].includes(url.protocol)) {
        throw new Error(`Product ${index + 1} has an unsupported link.`);
      }

      const card = document.createElement('article');
      const heading = document.createElement('h2');
      const description = document.createElement('p');
      const link = document.createElement('a');
      heading.textContent = product.name;
      description.textContent = product.description;
      link.href = url.href;
      link.textContent = 'Open';
      link.setAttribute('aria-label', `Open ${product.name}`);
      card.append(heading, description, link);
      cards.push(card);
    }
    grid.replaceChildren(...cards);
    status.textContent = cards.length ? '' : 'No products listed.';
    status.hidden = cards.length > 0;
  }

  function showError(error) {
    grid.replaceChildren();
    status.textContent = location.protocol === 'file:'
      ? 'Open this page over HTTP or HTTPS to load the adjacent products.json.'
      : `Could not load products.json: ${error.message}`;
    status.hidden = false;
  }

  fetch('./products.json', { cache: 'no-cache' })
    .then(response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    })
    .then(renderProducts)
    .catch(showError);
</script>
</body>
</html>
